# Cloudflare Workers へのデプロイ
# 必要な Secrets:
#   CLOUDFLARE_API_TOKEN
#   CLOUDFLARE_ACCOUNT_ID
#
# 注: メッセージにサンプルリポジトリURLが無かったため、
# Cloudflare 公式 wrangler-action の構成をベースにしています。
# サンプルと差分があれば貼ってもらえれば合わせます。

name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: cloudflare-workers
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --run

      - name: Build
        run: npm run build

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # wrangler.toml を参照して dist をデプロイ
          command: deploy
